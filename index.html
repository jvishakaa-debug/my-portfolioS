<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoleStyle - Footwear</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .footwear { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .card { background: white; border-radius: 10px; padding: 15px; width: 220px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 200px; height: 180px; object-fit: cover; border-radius: 8px; }
        .price { font-weight: bold; color: #e91e63; font-size: 18px; }
        button { background: #000; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <nav><h1>SoleStyle</h1></nav>
    <div class="footwear">
        <div class="card">
            <img src="images/heels.jfif" alt="Heels">
            <h3>Women's Heeled Sandal</h3>
            <p class="price">₹1,299</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="images/formal.jfif" alt="Formal">
            <h3>Men's Formal Shoe</h3>
            <p class="price">₹1,899</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="images/sneaker.jfif" alt="Sneaker">
            <h3>Trendy Sneaker</h3>
            <p class="price">₹1,499</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="images/loafer.jfif" alt="Loafer">
            <h3>Classic Loafer</h3>
            <p class="price">₹1,299</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>
</html>
